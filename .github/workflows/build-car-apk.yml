name: Build car probe APK

# 车机探针的构建。产物是 app-debug.apk，U 盘拷到车机上装。
# 只在手动触发时跑，和 iOS 的两条流水线互不影响。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 装编译需要的 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: 配 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 编译 debug APK
        run: gradle -p carprobe assembleDebug --no-daemon

      - name: 核对产物
        run: |
          apk=carprobe/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          ls -lh "$apk"
          echo "sha256=$(sha256sum "$apk" | cut -d' ' -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: LeapProbe-apk
          path: carprobe/app/build/outputs/apk/debug/app-debug.apk
