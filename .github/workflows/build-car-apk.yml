name: Build car probe APK

# 车机探针的构建。产物是 app-debug.apk，U 盘拷到车机上装。
# 只在手动触发时跑，和 iOS 的两条流水线互不影响。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它要装一个已经下架的 `tools` 包，在
      # 现在的镜像上直接失败。runner 自带 SDK，找到 sdkmanager 自己装组件更稳。
      - name: 装编译需要的 SDK 组件
        run: |
          set -euo pipefail
          SM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > carprobe/local.properties

      - name: 配 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 编译 debug APK
        run: gradle -p carprobe assembleDebug --no-daemon --stacktrace

      - name: 核对产物
        run: |
          apk=carprobe/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          ls -lh "$apk"
          sha256sum "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LeapProbe-apk
          path: carprobe/app/build/outputs/apk/debug/app-debug.apk
